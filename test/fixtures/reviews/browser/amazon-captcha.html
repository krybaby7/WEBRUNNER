<!DOCTYPE html>
<html class="a-no-js" lang="en-us">
<head><meta charset="utf-8"><title>Amazon.com</title>
<!-- SYNTHETIC (WP19b): Amazon's image CAPTCHA page as documented for automated visitors:
     form[action*="validateCaptcha"], "Enter the characters you see below", a captcha image and
     the #captchacharacters input. The live visit on 2026-10-21 got the softer "Continue shopping"
     variant of the same form, wrapped around the sign-in redirect (see amazon-signin.html). -->
</head>
<body>
<div class="a-container a-padding-double-large" style="min-width:350px;padding:44px 0 !important">
  <div class="a-row a-spacing-double-large" style="width: 350px; margin: 0 auto">
    <div class="a-row a-spacing-medium a-text-center"><i class="a-icon a-logo" alt="Amazon logo"></i></div>
    <div class="a-box a-alert a-alert-info a-spacing-base"><div class="a-box-inner"><i class="a-icon a-icon-alert" alt="Alert icon"></i>
      <h4>Enter the characters you see below</h4>
      <p class="a-last">Sorry, we just need to make sure you're not a robot. For best results, please make sure your browser is accepting cookies.</p>
    </div></div>
    <div class="a-section">
      <div class="a-box a-color-offset-background"><div class="a-box-inner a-padding-extra-large">
        <form method="get" action="/errors_page/validateCaptcha" name="">
          <input type="hidden" name="amzn" value="redacted"><input type="hidden" name="amzn-r" value="/product-reviews/B0CAPTCHA0">
          <div class="a-row a-spacing-large">
            <div class="a-box"><div class="a-box-inner">
              <h4>Type the characters you see in this image:</h4>
              <div class="a-row a-text-center"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="captcha"></div>
              <div class="a-row a-spacing-base">
                <div class="a-row"><div class="a-column a-span6"><label for="captchacharacters">Type characters</label></div></div>
                <input autocomplete="off" placeholder="Type characters" id="captchacharacters" name="field-keywords" class="a-span12" autocapitalize="off" spellcheck="false" autocorrect="off" type="text">
              </div>
            </div></div>
          </div>
          <div class="a-section a-spacing-extra-large">
            <div class="a-row"><span class="a-button a-button-primary a-span12"><span class="a-button-inner"><button type="submit" class="a-button-text">Continue shopping</button></span></span></div>
          </div>
        </form>
      </div></div>
    </div>
  </div>
</div>
</body>
</html>

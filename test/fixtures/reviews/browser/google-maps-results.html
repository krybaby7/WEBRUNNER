<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hotel Lutetia Paris - Google Maps</title>
<style>[role="feed"] > div { position: relative; padding: 12px; } [role="feed"] a { position: absolute; inset: 0; }</style>
<!-- SYNTHETIC (WP19b): a Google Maps search results list. Each result is an a[href*="/maps/place/"]
     with the place name as aria-label; the recipe opens the first one. The hrefs are relative so the
     fixture server can serve the place page. -->
</head>
<body>
<div role="main">
  <h2>Results</h2>
  <div role="feed" aria-label="Results for Hotel Lutetia Paris">
    <div><a href="/maps/place/H%C3%B4tel+Lutetia/data=!4m2!3m1!1s0x0" aria-label="Hôtel Lutetia"></a><div>Hôtel Lutetia</div><span role="img" aria-label="4.6 stars 1,234 reviews">4.6</span><div>5-star hotel</div></div>
    <div><a href="/maps/place/H%C3%B4tel+Bel+Ami/data=!4m2!3m1!1s0x1" aria-label="Hôtel Bel Ami"></a><div>Hôtel Bel Ami</div><span role="img" aria-label="4.5 stars 900 reviews">4.5</span><div>5-star hotel</div></div>
    <div><a href="/maps/place/Hotel+Montalembert/data=!4m2!3m1!1s0x2" aria-label="Hotel Montalembert"></a><div>Hotel Montalembert</div><span role="img" aria-label="4.4 stars 650 reviews">4.4</span><div>5-star hotel</div></div>
  </div>
</div>
</body>
</html>

    { id: "3fc89318-1be2-4a91-9c81-4bccfedd90e6", name: "Jeff Moore", stars: 5, date: "July 25, 2026", helpful: 43, history: true,
      text: "I love love love Notion. This platform came across my screen before any others did and they had me at, ## HELLO I have been able to form ideas and build blueprints to follow. There is just about nothing Notion workspace can't do. Automation, and integration great to call for a library of templates. I love the app I've only been able to use the free version but look forward to using the paid version soon!!! Keep making it better and better. So far it's just gotten better!!!" },

  const cards = document.getElementById("cards");

  let shownInDialog = 0;
  let pending = false;
  const BATCHES = [10, 14];
  function appendBatch() {
    const list = document.getElementById("all-list");
    const idx = BATCHES.indexOf(shownInDialog);
    const next = shownInDialog === 0 ? BATCHES[0] : idx >= 0 && idx + 1 < BATCHES.length ? BATCHES[idx + 1] : shownInDialog;
    for (let i = shownInDialog; i < next; i++) list.appendChild(card(REVIEWS[i]));
    shownInDialog = next;
  }
  document.getElementById("see-all").addEventListener("click", () => {
    const dialog = document.getElementById("all-reviews");
    dialog.hidden = false;
    setTimeout(() => {
      appendBatch();
      document.getElementById("all-list").addEventListener("scroll", () => {
        const list = document.getElementById("all-list");
        if (list.scrollTop + list.clientHeight < list.scrollHeight - 5) return;
        if (pending) return;
        pending = true;
        setTimeout(() => { appendBatch(); pending = false; }, 60);
      });
    }, 100);
  });

<!doctype html>
<!--
  SYNTHETIC fixture (WP18b): Facebook's security checkpoint, served under
  /checkpoint/... when an account or network is flagged. The recipe reports it
  as `blocked` without `needsLogin` (logging in again would not help).
-->
<html lang="en">
<head><meta charset="utf-8"><title>Security Check Required | Facebook</title></head>
<body>
<div role="main">
  <h1>Security check</h1>
  <p>We've detected unusual activity from your account or network. Please complete the security check to continue.</p>
  <button type="button">Continue</button>
</div>
</body>
</html>
